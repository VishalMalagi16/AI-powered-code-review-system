version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: codeguard_db
    environment:
      POSTGRES_USER: codeguard
      POSTGRES_PASSWORD: codeguard_password
      POSTGRES_DB: codeguard_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codeguard_backend
    environment:
      - DATABASE_URL=postgresql://codeguard:codeguard_password@db:5432/codeguard_db
      - SECRET_KEY=super-secret-docker-compose-key-replace-in-prod
      - AI_PROVIDER=auto
      - MOCK_AI_FALLBACK=True
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codeguard_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
